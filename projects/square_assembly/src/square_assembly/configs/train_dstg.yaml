# DstgPredictor(d(o,g) := E[steps-to-go | o]) 학습 — task/policy는 policy_ckpt 옆
# run_config.yaml에서 그대로 읽으므로(scripts/train_dstg.py) task=/policy= defaults가 없다.

policy_ckpt: ???
hdf5_path: ???
out: outputs/dstg/predictor.pt
num_bins_override: null  # 설정하면 데이터에서 자동으로 정하는 대신 이 값을 강제로 쓴다
label_horizon: null      # 남은 비율 x 이 값으로 라벨링(사람 속도에 불변). null이면 남은 스텝 수
preintv: none            # PREINTV 프레임 처리: none | drop | flat | rise | anchor(stg_labels.py)
preintv_weight: 1        # PREINTV 프레임을 train에서 몇 배로 복제할지(1=그대로)
preintv_len: null        # PREINTV 구간을 개입 시작점부터 몇 프레임으로 다시 잴지(null=저장된 15)
init_ckpt: null          # 파인튜닝: 이 predictor.pt의 헤드에서 시작(num_bins가 같아야 한다)
train_sources: null      # 병합본 demo attrs["source"]에 이 문자열 중 하나가 든 데모만 train(val은 그대로)
train_modes: null        # 학습에 쓸 프레임 종류(demo/rollout/intv/preintv). null이면 전부(val은 언제나 전부)
save_epochs: null        # 이 epoch들이 끝날 때 <out>_ep{N}.pt로 중간 저장(학습 곡선용)
encoder_lr: null         # 설정하면 비전 인코더도 이 lr로 같이 학습(풀 파인튜닝). null이면 헤드만

seed: 0
device: cuda
num_workers: 2

batch_size: 64
lr: 1.0e-4
weight_decay: 1.0e-6
num_epochs: 30
log_every: 50
head_hidden: [256, 256]

# 에피소드(데모) 단위 val 분할 — 무작위 transition 분할이 아니다(phases/4-diffusion-si/step1.md
# 관례 그대로, phases/5-mani-sim-ddpo/step1.md 참고).
val_fraction: 0.2
split_seed: 0

hydra:
  run:
    dir: outputs/dstg/hydra/${now:%Y%m%d-%H%M%S}
