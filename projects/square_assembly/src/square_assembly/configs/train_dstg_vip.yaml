# VIP 특징 캐시 위의 STG 예측기 학습 — scripts/train_dstg_vip.py.
# 하이퍼파라미터는 ResNet/DINO 기준선(train_dstg.yaml, train_dstg_dino.yaml)과 동일하게
# 고정한다. 인코더 말고 다른 변인이 끼면 val_mae/val_nll 비교가 성립하지 않는다.

cache_path: ???   # scripts/cache_vip_feats.py 산출물
out: outputs/dstg_vip/predictor.pt
num_bins_override: 501   # 기준선과 같은 bin 공간이어야 mae/nll을 그대로 비교할 수 있다
fail_bin: null           # 실패 롤아웃 데이터를 쓸 때만 설정(이번 실험은 PH 성공 데모만)
label_horizon: null      # 설정하면 라벨이 '남은 스텝 수' 대신 '남은 비율 x 이 값' —
                         # 에피소드 길이 편차가 큰 텔레옵 데이터용. num_bins도 같이 줄여야 한다.
train_demos_limit: null  # train 데모 수 상한(규모 곡선용). val 데모는 영향받지 않는다.
mode_hdf5: null          # action_mode를 읽어올 원본 hdf5 — preintv 처리를 쓸 때만 필요
preintv: none            # PREINTV 프레임 처리: none(그대로) | drop(train에서 제외) |
                         # flat(구간 내내 같은 라벨 = 진전 0) | rise(스텝마다 +1 = 후퇴)

obs_horizon: 2           # configs/policy/diffusion_unet.yaml과 동일
seed: 1
device: cuda
num_workers: 0           # 특징이 이미 메모리에 있어 워커가 이득이 없다

batch_size: 64
lr: 1.0e-4
weight_decay: 1.0e-6
num_epochs: 30
log_every: 5
head_hidden: [256, 256]

val_fraction: 0.2
split_seed: 0

hydra:
  run:
    dir: outputs/dstg_vip/hydra/${now:%Y%m%d-%H%M%S}
