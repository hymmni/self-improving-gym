# PickPlaceCan 이미지 task(2026-10-07, Can 트랙). env_name/robots/env_kwargs/obs_dims/action_dim은
# derive_task_meta가 hdf5 env_args에서 덮어쓴다 — 지금은 이미지 hdf5가 없어 low_dim v1.5 파일(env_args 출처)을 가리킨다.
name: can
env_name: PickPlaceCan
robots: Panda
hdf5_path: data/robomimic/can/ph/low_dim_v15.hdf5
camera_names: [agentview, robot0_eye_in_hand]
image_size: 84
rgb_keys: [agentview_image, robot0_eye_in_hand_image]
lowdim_keys: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos]
obs_dims:
  robot0_eef_pos: 3
  robot0_eef_quat: 4
  robot0_gripper_qpos: 2
action_dim: 7
